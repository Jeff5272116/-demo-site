<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展場送餐地圖 — Animated Demo</title>
<style>
:root{
  --ink-900:#24384F;
  --gold:#B8893C;
  --bg:#FAF9F5;
  --card:#ffffff;
  --border:#DCDCD6;
  --text:#262624;
  --text-sub:#6E6B63;
  --red:#D93025;
  --blue:#2F6FA8;
  --green:#4C8C5A;
  --purple:#7B4FA6;
  --gray:#8A8A85;
  --booth-fill:#EDEAE2;
  --booth-stroke:#C9C4B8;

  --fs-display:32px;
  --fs-h1:24px;
  --fs-h2:20px;
  --fs-h3:17px;
  --fs-body:15px;
  --fs-sub:13px;
  --fs-caption:12px;

  --lh-body:1.6;
}
.phone-mockup{
  --fs-h1:19px;
  --fs-h2:17px;
  --fs-h3:15px;
  --fs-body:14px;
  --fs-sub:12px;
  --fs-caption:11px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; background:var(--ink-900); color:var(--text); overflow:hidden; user-select:none; -webkit-user-select:none; }
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:var(--fs-body);
  line-height:var(--lh-body);
}
button{ font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; transition:transform .15s ease, opacity .15s ease; }
button:active{ transform:scale(0.96); opacity:0.85; }
ul{ margin:0; padding:0; list-style:none; }
blockquote{ margin:0; }

/* ---------- shared small components ---------- */
.btn-primary{ background:var(--ink-900); color:#fff; padding:8px 16px; border-radius:6px; font-size:var(--fs-body); font-weight:600; }
.btn-primary.sm{ padding:6px 12px; font-size:var(--fs-sub); }
.btn-secondary{ background:#fff; color:var(--ink-900); border:1px solid var(--border); padding:8px 16px; border-radius:6px; font-size:var(--fs-body); font-weight:600; }
.btn-secondary.sm{ padding:6px 12px; font-size:var(--fs-sub); }
.btn-ghost{ background:transparent; color:var(--ink-900); padding:6px 10px; border-radius:6px; font-size:var(--fs-sub); font-weight:500; }
.btn-ghost.sm{ padding:4px 8px; font-size:var(--fs-caption); }

.status-tag{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:var(--fs-caption); font-weight:600; color:#fff; white-space:nowrap; }
.status-tag.status-pending{ background:var(--red); }
.status-tag.status-delivering{ background:var(--blue); }
.status-tag.status-delivered{ background:var(--green); }
.status-tag.status-exception{ background:var(--purple); }
.status-tag.status-cancelled{ background:var(--gray); }

.note-raw{ background:#F5F2EA; border-left:4px solid var(--gold); padding:8px 10px; margin:8px 0; font-size:var(--fs-sub); color:var(--text-sub); border-radius:0 4px 4px 0; user-select:text; -webkit-user-select:text; }
.order-time-row{ font-size:var(--fs-caption); color:var(--text-sub); margin-top:4px; }
.item-note{ color:var(--text-sub); font-size:var(--fs-caption); margin-left:4px; }
.exception-reason{ background:#F3EAF6; color:var(--purple); border-radius:6px; padding:8px 10px; font-size:var(--fs-sub); margin-bottom:8px; }
.order-total{ text-align:right; font-weight:700; font-size:var(--fs-body); margin-top:6px; }
.item-list li{ display:flex; justify-content:space-between; padding:3px 0; font-size:var(--fs-body); border-bottom:1px dashed var(--border); }
.item-list li:last-child{ border-bottom:none; }

/* ---------- toast (scoped inside the phone screen) ---------- */
.toast{ background:var(--ink-900); color:#fff; padding:8px 16px; border-radius:20px; font-size:var(--fs-sub); margin-top:8px; box-shadow:0 6px 20px rgba(0,0,0,.25); text-align:center; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#v2-toast-slot{ position:absolute; left:0; right:0; bottom:64px; z-index:850; display:flex; flex-direction:column; align-items:center; pointer-events:none; padding:0 16px; }
body.real-phone #v2-toast-slot{ bottom:calc(64px + env(safe-area-inset-bottom, 0px)); }

/* ---------- generic modal (Demo 說明) ---------- */
.modal-overlay{ position:fixed; inset:0; z-index:900; display:none; align-items:center; justify-content:center; }
.modal-backdrop{ position:absolute; inset:0; background:rgba(36,56,79,.55); }
.modal-card{ position:relative; background:#fff; border-radius:8px; width:min(460px,90vw); max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.35); z-index:1; }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:#fff; z-index:2; }
.modal-header h3{ margin:0; font-size:var(--fs-h2); }
.modal-close{ font-size:var(--fs-h3); color:var(--text-sub); padding:4px 8px; }
.modal-body{ padding:16px 20px 20px; }
.modal-body p{ margin:0 0 8px; font-size:var(--fs-body); }
.modal-body ul{ padding-left:18px; }
.modal-body li{ list-style:disc; font-size:var(--fs-sub); color:var(--text-sub); margin-bottom:4px; }

/* ---------- shared booth-order headline (bottom sheet header) ---------- */
.sheet-headline{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; min-width:0; }
.sheet-booth-id{ font-size:var(--fs-h1); font-weight:800; color:var(--ink-900); }
.sheet-vendor{ font-size:var(--fs-h3); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.sheet-sub{ font-size:var(--fs-caption); color:var(--text-sub); margin-top:2px; }
.order-detail-card{ background:#FAF9F5; border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
.odc-head{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none; gap:8px; }
.odc-head-left{ display:flex; align-items:center; gap:8px; min-width:0; }
.odc-order-id{ font-size:var(--fs-sub); font-weight:700; color:var(--ink-900); }
.odc-chevron{ font-size:var(--fs-caption); color:var(--text-sub); transition:transform .25s ease; display:inline-block; flex:none; }
.order-detail-card.collapsed .odc-chevron{ transform:rotate(-90deg); }
.odc-body{ overflow:hidden; padding-top:8px; }
.modal-order-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; flex-wrap:wrap; }

/* ---------- confirm dialog (scoped inside phone screen) ---------- */
.confirm-overlay{ position:fixed; inset:0; z-index:950; display:none; align-items:center; justify-content:center; }
.confirm-overlay.scoped{ position:absolute; z-index:850; }
.confirm-backdrop{ position:absolute; inset:0; background:rgba(36,56,79,.5); }
.confirm-card{ position:relative; background:#fff; border-radius:10px; padding:20px; width:min(320px,84vw); box-shadow:0 20px 50px rgba(0,0,0,.3); z-index:1; text-align:center; }
.confirm-msg{ font-size:var(--fs-body); margin-bottom:16px; }
.confirm-actions{ display:flex; gap:10px; justify-content:center; }

/* ---------- map svg shared ---------- */
.map-svg{ width:100%; height:100%; display:block; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
.map-svg:active{ cursor:grabbing; }
.hall-bg{ fill:#fff; stroke:var(--border); stroke-width:2; }
.zone-shape{ pointer-events:none; }
.booth-shape{ fill:var(--booth-fill); stroke:var(--booth-stroke); stroke-width:1; transition:fill .25s,stroke .25s,transform .15s ease,opacity .15s ease; transform-box:fill-box; transform-origin:center; }
.booth{ cursor:pointer; }
.booth:hover .booth-shape{ transform:translateY(-2px); filter:drop-shadow(0 2px 3px rgba(0,0,0,.28)); }
.booth:active .booth-shape{ transform:scale(0.94); opacity:.85; }
.booth-label{ fill:#8f8a7d; pointer-events:none; font-family:inherit; }
.booth[data-status="pending"] .booth-shape{ fill:var(--red); stroke:var(--red); }
.booth[data-status="pending"] .booth-label{ fill:#fff; }
.booth[data-status="delivering"] .booth-shape{ fill:var(--blue); stroke:var(--blue); }
.booth[data-status="delivering"] .booth-label{ fill:#fff; }
.booth[data-status="exception"] .booth-shape{ fill:var(--purple); stroke:var(--purple); }
.booth[data-status="exception"] .booth-label{ fill:#fff; }
.landmark-label{ fill:#A39D8E; font-size:7px; pointer-events:none; } /* fs-exempt: SVG map landmark label scales with canvas zoom */
.landmark-marker rect{ fill:rgba(255,255,255,.92); stroke:#A39D8E; stroke-width:.8; }
.landmark-marker text{ font-size:6px; fill:#6E6B63; font-weight:700; pointer-events:none; } /* fs-exempt: SVG map facility icon glyph scales with canvas zoom */
.landmark-arrow{ fill:#B8893C; stroke:none; pointer-events:none; }
.booth-badge circle{ stroke:#fff; stroke-width:.6; }
.booth-badge text{ font-size:6px; fill:#fff; font-weight:700; pointer-events:none; } /* fs-exempt: SVG map badge text scales with canvas zoom */
.pulse-ring{ fill:none; stroke:var(--gold); stroke-width:1.6; pointer-events:none; }
.map-callout rect{ fill:var(--ink-900); }
.map-callout polygon{ fill:var(--ink-900); }
.map-callout text{ fill:#fff; font-size:6px; pointer-events:none; } /* fs-exempt: SVG map callout text scales with canvas zoom */

.drag-hint{ position:absolute; font-size:var(--fs-caption); color:var(--text-sub); background:rgba(255,255,255,.88); padding:4px 8px; border-radius:6px; z-index:20; pointer-events:none; }
.map-toolbar{ position:absolute; display:flex; gap:6px; z-index:20; }
.map-tool-btn{ width:34px; height:34px; border-radius:8px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.15); font-size:var(--fs-h3); display:flex; align-items:center; justify-content:center; flex:none; }
.floor-chip{ background:rgba(255,255,255,.12); font-size:var(--fs-caption); padding:3px 10px; border-radius:10px; flex:none; }

/* =========================================================
   App stage — desktop shows a centered phone mockup,
   real phone (<=480px) goes fullscreen (see body.real-phone below)
   ========================================================= */
#view-v2{ position:fixed; inset:0; display:block; z-index:8; background:var(--ink-900); }
.v2-stage{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:20px; }
.phone-frame{
  height:min(844px, calc(100dvh - 48px));
  aspect-ratio:390/844;
  width:auto;
  max-width:calc(100vw - 32px);
  background:#000; border-radius:56px; padding:12px; box-shadow:0 30px 100px rgba(0,0,0,.6); position:relative; flex:none;
}
.phone-screen{ width:100%; height:100%; background:var(--bg); border-radius:44px; overflow:hidden; position:relative; }
.dynamic-island{ position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:35px; background:#000; border-radius:20px; z-index:100; }
.home-indicator{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:rgba(0,0,0,.6); z-index:100; }
.status-bar{ position:absolute; top:0; left:0; right:0; height:47px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; font-size:var(--fs-caption); font-weight:600; z-index:90; color:var(--text); }

.v2-view{ position:absolute; inset:0; display:none; flex-direction:column; padding-top:47px; }
.v2-view.is-active{ display:flex; }

.v2-d0-header{ padding:14px 18px 8px; border-bottom:1px solid var(--border); }
.v2-refresh-meta{ font-size:var(--fs-caption); color:var(--text-sub); }
.v2-d0-title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.v2-d0-title-row h2{ margin:0; font-size:var(--fs-h1); font-weight:800; color:var(--ink-900); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.v2-d0-title-row .floor-chip{ background:#EFEBE0; color:var(--ink-900); }
.v2-d0-sub-row{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; gap:8px; }
.v2-count-chip{ font-size:var(--fs-sub); color:var(--text-sub); flex:none; }
.refresh-btn{ font-size:var(--fs-body); color:var(--ink-900); padding:4px 8px; flex:none; }
.v2-d0-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; position:relative; padding-bottom:70px; }
.pull-indicator{ position:absolute; top:0; left:0; right:0; text-align:center; font-size:var(--fs-sub); color:var(--text-sub); opacity:0; transform:translateY(-10px); pointer-events:none; z-index:5; padding-top:6px; }
.d0-card{ margin:8px 14px; padding:10px 12px; background:#fff; border:1px solid var(--border); border-radius:8px; min-width:0; }
.d0-card-row1{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.booth-no{ font-size:var(--fs-h3); font-weight:800; color:var(--ink-900); flex:none; }
.order-vendor{ font-size:var(--fs-sub); color:var(--text); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.order-summary{ font-size:var(--fs-caption); color:var(--text-sub); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.d0-card-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; flex-wrap:wrap; }
.v2-empty-state{ display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:60px 20px; color:var(--text-sub); font-size:var(--fs-h3); text-align:center; }
.confetti-dot{ position:absolute; left:50%; top:110px; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:6; }

.v2-tabbar{ position:absolute; left:0; right:0; bottom:0; height:64px; background:#fff; border-top:1px solid var(--border); display:flex; z-index:60; }
.tab-item{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--text-sub); cursor:pointer; }
.tab-item.active{ color:var(--gold); font-weight:700; }
.tab-icon{ font-size:var(--fs-h3); line-height:1; }
.tab-label{ font-size:var(--fs-caption); }

/* D1 */
.v2-d1-topbar{ display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); background:#fff; z-index:10; position:relative; }
.v2-d1-back{ font-size:var(--fs-h3); color:var(--ink-900); padding:4px 8px; flex:none; }
.v2-d1-title{ font-size:var(--fs-h3); font-weight:700; color:var(--ink-900); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.v2-map-wrap{ flex:1; position:relative; overflow:hidden; }
.v2-map-wrap .map-toolbar{ flex-direction:column; top:14px; right:14px; }
.v2-map-wrap .drag-hint{ top:12px; left:12px; }

.v2-sheet-backdrop{ position:absolute; inset:0; background:rgba(36,56,79,.45); z-index:790; display:none; }
.v2-sheet{ position:absolute; left:0; right:0; bottom:0; height:74%; background:#fff; border-radius:20px 20px 0 0; z-index:800; display:none; flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.25); }
.sheet-handle{ width:36px; height:5px; border-radius:3px; background:#D8D5CC; margin:10px auto 4px; flex:none; cursor:grab; }
.sheet-header{ padding:0 20px 8px; border-bottom:1px solid var(--border); flex:none; }
.sheet-body{ padding:12px 20px 24px; overflow-y:auto; flex:1; }

/* ---------- demo control cluster (lives outside the phone mockup) ---------- */
.demo-fab-cluster{ position:fixed; right:16px; bottom:16px; z-index:2000; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.demo-fab-menu{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.demo-fab-btn{ background:rgba(255,255,255,.16); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#fff; font-size:var(--fs-sub); font-weight:600; padding:8px 14px; border-radius:20px; box-shadow:0 4px 16px rgba(0,0,0,.3); white-space:nowrap; }
.demo-fab-toggle{ display:none; width:44px; height:44px; border-radius:50%; align-items:center; justify-content:center; background:rgba(255,255,255,.22); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#fff; font-size:var(--fs-h3); font-weight:700; box-shadow:0 4px 16px rgba(0,0,0,.3); }

/* real phone: strip mockup chrome, go fullscreen */
body.real-phone .v2-stage{ padding:0; }
body.real-phone .phone-frame{ width:100vw; height:100vh; height:100dvh; aspect-ratio:auto; max-width:none; padding:0; border-radius:0; box-shadow:none; background:none; }
body.real-phone .phone-screen{ border-radius:0; }
/* fake iOS chrome is mockup-only; a real phone has its own status bar */
body.real-phone .dynamic-island, body.real-phone .status-bar, body.real-phone .home-indicator{ display:none !important; }
body.real-phone .v2-view{ padding-top:max(env(safe-area-inset-top, 0px), 10px); }
body.real-phone .demo-fab-cluster{ right:12px; bottom:calc(64px + env(safe-area-inset-bottom, 0px) + 12px); }
body.real-phone .demo-fab-toggle{ display:flex; }
body.real-phone .demo-fab-menu{ display:none; }
body.real-phone .demo-fab-menu.open{ display:flex; }

</style>
</head>
<body>

<!-- ============ app view: phone mockup (desktop) / fullscreen app (real phone) ============ -->
<section id="view-v2" class="view">
  <div class="v2-stage">
    <div class="phone-frame">
      <div class="phone-screen phone-mockup" id="phone-screen">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>8:00</span><span>📶 📡 🔋</span></div>

        <!-- D0: flat delivery list -->
        <div class="v2-view is-active" id="v2-d0">
          <div class="v2-d0-header">
            <div class="v2-d0-title-row"><h2>待送清單</h2><span class="floor-chip">1館 1F</span></div>
            <div class="v2-d0-sub-row">
              <span class="v2-count-chip" id="v2-count-chip">0 筆</span>
              <span class="v2-refresh-meta" id="v2-refresh-time"></span>
              <button class="refresh-btn" id="v2-refresh-btn">⟳</button>
            </div>
          </div>
          <div class="v2-d0-scroll" id="v2-d0-scroll">
            <div class="pull-indicator" id="v2-pull-indicator">↓ 更新中...</div>
            <div id="v2-order-list"></div>
            <div class="v2-empty-state" id="v2-empty-state">✅<br>今日配送完成 ✓</div>
          </div>
          <div class="v2-tabbar">
            <div class="tab-item active" id="tab-d0"><span class="tab-icon">📋</span><span class="tab-label">待送</span></div>
            <div class="tab-item" id="tab-d1"><span class="tab-icon">🗺️</span><span class="tab-label">地圖</span></div>
            <div class="tab-item" id="tab-profile"><span class="tab-icon">👤</span><span class="tab-label">我的</span></div>
          </div>
        </div>

        <!-- D1: map -->
        <div class="v2-view" id="v2-d1">
          <div class="v2-d1-topbar">
            <button class="v2-d1-back" id="v2-d1-back">← 返回</button>
            <span class="v2-d1-title" id="v2-d1-title">全場地圖</span>
          </div>
          <div class="v2-map-wrap">
            <svg id="v2-map-svg" class="map-svg" viewBox="0 0 1000 1414"></svg>
            <div class="drag-hint">🖐 拖曳可平移</div>
            <div class="map-toolbar">
              <button class="map-tool-btn" id="v2-zoom-in">＋</button>
              <button class="map-tool-btn" id="v2-zoom-out">－</button>
            </div>
          </div>
        </div>

        <div class="v2-sheet-backdrop" id="v2-sheet-backdrop"></div>
        <div class="v2-sheet" id="v2-sheet">
          <div class="sheet-handle" id="v2-sheet-handle"></div>
          <div class="sheet-header" id="v2-sheet-header"></div>
          <div class="sheet-body" id="v2-sheet-body"></div>
        </div>

        <div class="confirm-overlay scoped" id="confirm-v2">
          <div class="confirm-backdrop"></div>
          <div class="confirm-card">
            <div class="confirm-msg"></div>
            <div class="confirm-actions">
              <button class="btn-secondary confirm-no">取消</button>
              <button class="btn-primary confirm-yes">確認</button>
            </div>
          </div>
        </div>

        <div id="v2-toast-slot"></div>
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ demo control cluster (outside the phone mockup) ============ -->
<div class="demo-fab-cluster" id="demo-fab-cluster">
  <div class="demo-fab-menu" id="demo-fab-menu">
    <button class="demo-fab-btn" id="btn-simulate">🍱 模擬新訂單</button>
    <button class="demo-fab-btn" id="btn-reset">↺ 重置</button>
    <button class="demo-fab-btn" id="btn-demo-info">ⓘ 說明</button>
  </div>
  <button class="demo-fab-toggle" id="demo-fab-toggle">⋯</button>
</div>

<!-- ============ Demo 說明 modal (kept, no longer auto-opens) ============ -->
<div class="modal-overlay" id="demo-info-overlay">
  <div class="modal-backdrop" id="demo-info-backdrop"></div>
  <div class="modal-card" id="demo-info-card">
    <div class="modal-header"><h3>Demo 說明</h3><button class="modal-close" id="demo-info-close">✕</button></div>
    <div class="modal-body">
      <p>本 Demo 呈現「展場送餐地圖」核心概念：</p>
      <ul>
        <li>圖資：AI WAVE SHOW 2026 世貿一館 1F 官方平面圖，經自動抽取座標與攤位編號後由 AI 重新繪製</li>
        <li>訂單：模擬既有點餐系統資料，非即時真實訂單</li>
        <li>重新整理頁面即會重置所有資料至初始狀態</li>
      </ul>
    </div>
  </div>

function itemsTotal(items){ return items.reduce((s,it)=> s + (PRICE[it.name]||0)*it.qty, 0); }

function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }
function qs(s,root){ return (root||document).querySelector(s); }
function qsa(s,root){ return Array.from((root||document).querySelectorAll(s)); }
function nowTimeStr(){ return new Date().toTimeString().slice(0,8); }
function relTime(ts){
  const diffMin = Math.max(0, Math.round((Date.now()-ts)/60000));
  if(diffMin<1) return '剛剛';
  if(diffMin<60) return diffMin + ' 分鐘前';
  const h = Math.floor(diffMin/60), m = diffMin%60;
  return h + ' 小時' + (m? m+'分':'') + '前';
}

/* HOME view = fitted to the hall bounds (not the full viewBox) so D1 opens
   already zoomed to the venue instead of showing 2/3 empty canvas */
const HALL_VIEW_PADDING = 30;
function computeHomeView(){
  const hall = MAP_DATA.hall[0];
  const W = MAP_DATA.viewBox.w, H = MAP_DATA.viewBox.h;
  const scale = Math.min(W/(hall.w + HALL_VIEW_PADDING*2), H/(hall.h + HALL_VIEW_PADDING*2));
  const cx = hall.x + hall.w/2, cy = hall.y + hall.h/2;
  return { scale, tx: W/2 - scale*cx, ty: H/2 - scale*cy };
}

const state = {
  orders: [],
  completedToday: 0,
  currentV2: 'd0',
  maps: { v2: computeHomeView() },
  sheetBoothId: null,
  legendOpen: true,
  pendingFocus: null,
  isRealPhone: window.innerWidth <= 480
};
const boothTweens = {};

function boothOrders(boothId){ return state.orders.filter(o=>o.boothId===boothId); }
function boothActiveOrder(boothId){
  const os = boothOrders(boothId);
  return os.find(o=>o.status==='pending') || os.find(o=>o.status==='exception') || os.find(o=>o.status==='delivering') || null;
}
function isBoothFree(boothId){
  const b = findBooth(boothId);
  if(!b || !b.vendor) return false;
  return !boothOrders(boothId).some(o=> ['pending','delivering','exception'].includes(o.status));
}
function getOrder(id){ return state.orders.find(o=>o.id===id); }
function activeOrdersSorted(){
  /* D0 是一張平鋪清單，依下單時間舊→新排序 */
  return state.orders.filter(o=>['pending','delivering','exception'].includes(o.status)).sort((a,b)=>a.createdAt-b.createdAt);
}
function seedAndCompute(){
  state.orders = seedOrders();
  state.completedToday = state.orders.filter(o=>o.status==='delivered').length;
}

<script>
/* =========================================================
   MAP RENDERING + PAN/ZOOM + INTERACTIONS
   ========================================================= */
function buildZonesMarkup(){
  let html='';
  MAP_DATA.zones.forEach(z=>{
    html += `<rect class="zone-shape" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="${z.color}" fill-opacity="0.2" stroke="${z.color}" stroke-opacity="0.35" stroke-width="1"></rect>`;
  });
  return html;
}
function buildBoothsMarkup(){
  let html='';
  MAP_DATA.booths.forEach(b=>{
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    const boothFs = Math.max(3.6, Math.min(6.5, b.w*0.28));
    const label = `<text class="booth-label" x="${cx}" y="${cy+boothFs*0.32}" text-anchor="middle" font-size="${boothFs}">${b.id.slice(1)}</text>`; // fs-exempt: SVG map booth number scales with canvas zoom, not a UI text token
    html += `<g class="booth" data-booth="${b.id}" data-status="none" data-vendor="${b.vendor?svgEscape(b.vendor):''}"><rect class="booth-shape" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="1.2"></rect>${label}</g>`;
  });
  return html;
}
function buildLandmarksMarkup(){
  /* renders only categories listed in LANDMARK_SHOW; facility/circulation get a small
     icon marker in addition to (or instead of) plain text so they read at a glance */
  let html='';
  MAP_DATA.landmarks.forEach(l=>{
    if(!LANDMARK_SHOW.includes(l.category)) return;
    if(l.marker==='icon-wc'){
      html += `<g class="landmark-marker landmark-wc"><rect x="${l.x-9}" y="${l.y-9}" width="18" height="18" rx="4"></rect><text x="${l.x}" y="${l.y+3}" text-anchor="middle">WC</text></g>`;
      return;
    }
    if(l.marker==='icon-elevator'){
      html += `<g class="landmark-marker landmark-elevator"><rect x="${l.x-7}" y="${l.y-25}" width="14" height="14" rx="3"></rect><text x="${l.x}" y="${l.y-15}" text-anchor="middle">⇅</text></g>`;
    }
    if(l.marker==='arrow-up'){
      html += `<polygon class="landmark-arrow" points="${l.x},${l.y-19} ${l.x-5},${l.y-11} ${l.x+5},${l.y-11}"></polygon>`;
    }
    html += `<text class="landmark-label" x="${l.x}" y="${l.y}" text-anchor="middle">${svgEscape(l.label)}</text>`;
  });
  return html;
}
function initMapSvg(svgId, prefix){
  const svg = document.getElementById(svgId);
  svg.setAttribute('viewBox', `0 0 ${MAP_DATA.viewBox.w} ${MAP_DATA.viewBox.h}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const hall = MAP_DATA.hall[0];
  let html = `<g id="${prefix}-viewport">`;
  html += `<rect class="hall-bg" x="${hall.x}" y="${hall.y}" width="${hall.w}" height="${hall.h}"></rect>`;
  html += buildZonesMarkup();
  html += `<g class="booths-layer" id="${prefix}-booths-layer">${buildBoothsMarkup()}</g>`;
  html += buildLandmarksMarkup();
  html += `<g class="fx-layer" id="${prefix}-fx-layer"></g>`;
  html += `</g>`;
  svg.innerHTML = html;
  applyMapTransform(prefix);
}
function applyMapTransform(prefix){
  const st = state.maps[prefix];
  const g = document.getElementById(prefix+'-viewport');
  if(g) g.setAttribute('transform', `translate(${st.tx},${st.ty}) scale(${st.scale})`);
}
function zoomBy(prefix, factor){
  const st = state.maps[prefix];
  const W=MAP_DATA.viewBox.w, H=MAP_DATA.viewBox.h;
  const newScale = clamp(st.scale*factor, 1, 4.5);
  const ux = (W/2 - st.tx)/st.scale, uy = (H/2 - st.ty)/st.scale;
  const targetTx = W/2 - newScale*ux, targetTy = H/2 - newScale*uy;
  gsap.to(st, {scale:newScale, tx:targetTx, ty:targetTy, duration:0.3, ease:'power2.out', onUpdate:()=>applyMapTransform(prefix)});
}
function zoomReset(prefix){
  const st = state.maps[prefix];
  const home = computeHomeView();
  gsap.to(st, {scale:home.scale, tx:home.tx, ty:home.ty, duration:0.4, ease:'power2.inOut', onUpdate:()=>applyMapTransform(prefix)});
}
function focusBooth(prefix, boothId, opts){
  opts = opts || {};
  const b = findBooth(boothId); if(!b) return;
  const st = state.maps[prefix];
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  const targetScale = opts.scale || 2.6;
  const W=MAP_DATA.viewBox.w, H=MAP_DATA.viewBox.h;
  const targetTx = W/2 - targetScale*cx, targetTy = H/2 - targetScale*cy;
  gsap.to(st, {scale:targetScale, tx:targetTx, ty:targetTy, duration:opts.duration||0.8, ease:'power2.inOut',
    onUpdate:()=>applyMapTransform(prefix),
    onComplete:()=>{
      if(opts.pulse!==false) pulseBooth(prefix, boothId);
      if(opts.callout!==false) showMapCallout(prefix, boothId);
    }
  });
}
function pulseBooth(prefix, boothId){
  const b = findBooth(boothId); if(!b) return;
  const fx = document.getElementById(prefix+'-fx-layer'); if(!fx) return;
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  const baseR = Math.max(b.w,b.h)/2;
  for(let i=0;i<2;i++){
    const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ring.setAttribute('cx',cx); ring.setAttribute('cy',cy); ring.setAttribute('r',baseR);
    ring.setAttribute('class','pulse-ring');
    ring.setAttribute('vector-effect','non-scaling-stroke');
    fx.appendChild(ring);
    gsap.fromTo(ring, {attr:{r:baseR}, opacity:0.9}, {attr:{r:baseR*3.2}, opacity:0, duration:1.1, delay:i*0.25, ease:'power1.out', onComplete:()=>ring.remove()});
  }
}
function showMapCallout(prefix, boothId){
  const b = findBooth(boothId); if(!b) return;
  const fx = document.getElementById(prefix+'-fx-layer'); if(!fx) return;
  const old = fx.querySelector('.map-callout'); if(old) old.remove();
  const cx=b.x+b.w/2, cy=b.y-4;
  const text = `${b.id}｜${b.vendor||'尚無廠商資料'}`;
  const w = Math.max(36, text.length*4.6);
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','map-callout');
  g.innerHTML = `<rect x="${-w/2}" y="-16" width="${w}" height="16" rx="3"></rect><polygon points="-4,0 4,0 0,5"></polygon><text x="0" y="-5" text-anchor="middle">${svgEscape(text)}</text>`;
  fx.appendChild(g);
  gsap.set(g, {x:cx, y:cy, scale:0, opacity:0});
  gsap.to(g, {scale:1, opacity:1, duration:0.35, ease:'back.out(2)'});
  gsap.to(g, {opacity:0, duration:0.4, delay:2.2, onComplete:()=>{ if(g.parentNode) g.remove(); }});
}
function showGreenCheckStamp(boothId){
  const prefix='v2';
  const fx = document.getElementById(prefix+'-fx-layer'); if(!fx) return;
  const b = findBooth(boothId); if(!b) return;
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','check-stamp');
  g.innerHTML = `<circle r="9" fill="#4C8C5A"></circle><path d="M-4,0 L-1,3.5 L5,-4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>`;
  fx.appendChild(g);
  gsap.set(g, {x:b.x+b.w/2, y:b.y+b.h/2, scale:0});
  gsap.to(g, {scale:1, duration:0.35, ease:'back.out(3)'});
  gsap.to(g, {opacity:0, duration:0.5, delay:1.0, onComplete:()=>{ if(g.parentNode) g.remove(); }});
}
function setBoothBadge(boothId, text, color){
  qsa(`.booth[data-booth="${boothId}"]`).forEach(g=>{
    let badge = g.querySelector('.booth-badge');
    const rectEl = g.querySelector('.booth-shape');
    const x = parseFloat(rectEl.getAttribute('x')) + parseFloat(rectEl.getAttribute('width'));
    const y = parseFloat(rectEl.getAttribute('y'));
    if(!text){ if(badge) badge.remove(); return; }
    if(!badge){
      badge = document.createElementNS('http://www.w3.org/2000/svg','g');
      badge.setAttribute('class','booth-badge');
      badge.innerHTML = `<circle r="4.4" fill="${color}"></circle><text text-anchor="middle" dy="1.8">${text}</text>`;
      badge.setAttribute('transform', `translate(${x},${y})`);
      g.appendChild(badge);
      gsap.set(badge, {transformOrigin:'center'});
      gsap.fromTo(badge, {scale:0}, {scale:1, duration:0.35, ease:'back.out(2)'});
    } else {
      badge.querySelector('circle').setAttribute('fill', color);
      badge.querySelector('text').textContent = text;
      badge.setAttribute('transform', `translate(${x},${y})`);
    }
  });
}
function setBoothBlink(boothId, on){
  if(boothTweens[boothId]){ boothTweens[boothId].kill(); delete boothTweens[boothId]; }
  const els = qsa(`.booth[data-booth="${boothId}"] .booth-shape`);
  gsap.set(els, {opacity:1});
  if(on){
    boothTweens[boothId] = gsap.to(els, {opacity:0.4, duration:0.55, ease:'sine.inOut', yoyo:true, repeat:-1});
  }
}
function refreshBoothVisuals(){
  MAP_DATA.booths.forEach(b=>{
    const order = boothActiveOrder(b.id);
    const status = order ? order.status : 'none';
    qsa(`.booth[data-booth="${b.id}"]`).forEach(g=> g.setAttribute('data-status', status));
    if(status==='pending'){
      const cnt = boothOrders(b.id).filter(o=>o.status==='pending').length;
      setBoothBadge(b.id, String(cnt), '#D93025');
      setBoothBlink(b.id, true);
    } else if(status==='exception'){
      setBoothBadge(b.id, '!', '#7B4FA6');
      setBoothBlink(b.id, false);
    } else {
      setBoothBadge(b.id, null);
      setBoothBlink(b.id, false);
    }
  });
}

/* ---------- click / drag ---------- */
function onBoothClick(prefix, boothId){
  const order = boothActiveOrder(boothId);
  if(order){ openBottomSheet(boothId); }
  else { showMapCallout(prefix, boothId); }
}
function attachMapEvents(svgId, prefix){
  const svg = document.getElementById(svgId);
  let dragging=false, moved=false, startX=0, startY=0, baseTx=0, baseTy=0, downBoothId=null;

  svg.addEventListener('pointerdown', e=>{
    dragging=true; moved=false; startX=e.clientX; startY=e.clientY;
    const st = state.maps[prefix]; baseTx=st.tx; baseTy=st.ty;
    /* capture the originally-pressed booth BEFORE setPointerCapture retargets
       subsequent pointerup/click events to the svg element itself */
    const g = e.target.closest('.booth');
    downBoothId = g ? g.getAttribute('data-booth') : null;
    try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  });
  svg.addEventListener('pointermove', e=>{
    if(!dragging) return;
    if(Math.abs(e.clientX-startX)>4 || Math.abs(e.clientY-startY)>4) moved=true;
    const st = state.maps[prefix];
    const rect = svg.getBoundingClientRect();
    const factor = MAP_DATA.viewBox.w / rect.width;
    st.tx = baseTx + (e.clientX-startX)*factor;
    st.ty = baseTy + (e.clientY-startY)*factor;
    applyMapTransform(prefix);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evt=> svg.addEventListener(evt, ()=>{ dragging=false; }));
  svg.addEventListener('click', e=>{
    const boothId = downBoothId;
    downBoothId = null;
    if(moved){ moved=false; return; }
    if(!boothId) return;
    onBoothClick(prefix, boothId);
  });
}

<script>
/* =========================================================
   TOAST (always rendered inside the phone screen)
   ========================================================= */
function showToast(msg){
  const container = document.getElementById('v2-toast-slot');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  container.appendChild(el);
  gsap.fromTo(el, {opacity:0, y:10}, {opacity:1, y:0, duration:0.25});
  setTimeout(()=>{ gsap.to(el, {opacity:0, y:10, duration:0.25, onComplete:()=>{ if(el.parentNode) el.remove(); }}); }, 2500);
}

/* =========================================================
   ORDER DETAIL CARD (shared: bottom sheet body)
   ========================================================= */
function renderOrderDetailCard(o){
  const itemsHtml = o.items.map(it=>`<li><span>${it.name} x${it.qty}</span>${it.note?`<span class="item-note">（${it.note}）</span>`:''}</li>`).join('');
  const total = itemsTotal(o.items);
  let actionHtml='';
  if(o.status==='pending') actionHtml = `<button class="btn-primary" data-act="pickup" data-order-id="${o.id}">取件出發</button>`;
  else if(o.status==='delivering') actionHtml = `<button class="btn-primary" data-act="delivered" data-order-id="${o.id}">已送達</button>`;
  else if(o.status==='exception') actionHtml = `<button class="btn-secondary" data-act="resolve" data-order-id="${o.id}">解除異常</button>`;
  const exceptionHtml = o.status==='exception' ? `<div class="exception-reason">⚠️ ${o.exceptionReason||'異常擱置'}</div>` : '';
  return `<div class="order-detail-card">
    <div class="odc-head" data-act="togglecard" data-order-id="${o.id}">
      <span class="odc-head-left"><span class="odc-order-id">訂單 ${o.id}</span><span class="status-tag status-${o.status}">${STATUS_LABEL[o.status]}</span></span>
      <span class="odc-chevron">▾</span>
    </div>
    <div class="odc-body">
      ${exceptionHtml}
      <ul class="item-list">${itemsHtml}</ul>
      <div class="order-total">總計：NT$ ${total}</div>
      <blockquote class="note-raw">「${o.noteRaw}」</blockquote>
      <div class="order-time-row">下單時間：${relTime(o.createdAt)}</div>
      <div class="modal-order-actions">
        <button class="btn-ghost" data-act="zoom" data-order-id="${o.id}">🔍 在地圖上放大</button>
        ${actionHtml}
      </div>
    </div>
  </div>`;
}
function toggleDetailCard(headEl){
  const card = headEl.closest('.order-detail-card');
  const body = card.querySelector('.odc-body');
  if(card.classList.contains('collapsed')){
    card.classList.remove('collapsed');
    body.style.display='block';
    gsap.set(body, {height:'auto', opacity:1});
    const h = body.scrollHeight;
    gsap.fromTo(body, {height:0, opacity:0}, {height:h, opacity:1, duration:0.3, ease:'power2.out', onComplete:()=>{ body.style.height='auto'; }});
  } else {
    card.classList.add('collapsed');
    gsap.fromTo(body, {height:body.scrollHeight, opacity:1}, {height:0, opacity:0, duration:0.25, ease:'power2.in', onComplete:()=>{ body.style.display='none'; }});
  }
}
function handleDetailAction(e){
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const act = btn.getAttribute('data-act'), orderId = btn.getAttribute('data-order-id');
  if(act==='togglecard'){
    toggleDetailCard(btn);
  } else if(act==='zoom'){
    const boothId = state.sheetBoothId;
    closeBottomSheet();
    focusBooth('v2', boothId, {scale:2.8});
  } else if(act==='pickup'){
    setOrderStatus(orderId, 'delivering', orderId);
    refreshSheetIfOpen();
  } else if(act==='delivered'){
    confirmThenDeliver(orderId);
  } else if(act==='resolve'){
    setOrderStatus(orderId, 'pending', orderId);
    refreshSheetIfOpen();
  }
}

/* =========================================================
   ORDER STATUS MUTATIONS
   ========================================================= */
function setOrderStatus(orderId, status, flashId){
  const o = getOrder(orderId); if(!o) return;
  o.status = status;
  refreshBoothVisuals();
  renderD0List(flashId);
}
function slideOutOrderCard(containerId, orderId){
  const container = document.getElementById(containerId); if(!container) return;
  const card = container.querySelector(`[data-order-id="${orderId}"]`); if(!card) return;
  gsap.to(card, {x:60, opacity:0, duration:0.4, ease:'power1.in'});
}
function completeDelivery(orderId){
  const o = getOrder(orderId); if(!o) return;
  slideOutOrderCard('v2-order-list', orderId);
  o.status='delivered';
  state.completedToday++;
  refreshBoothVisuals();
  showGreenCheckStamp(o.boothId);
  setTimeout(()=>{ renderD0List(); }, 420);
  closeBottomSheet();
  setTimeout(()=> navigateV2('d0','back'), 700);
}
function confirmThenDeliver(orderId){
  openConfirm('確認此訂單已送達？', ()=> completeDelivery(orderId));
}

/* =========================================================
   CONFIRM DIALOG (scoped to the phone screen)
   ========================================================= */
function openConfirm(msg, onYes){
  const root = document.getElementById('confirm-v2');
  root.querySelector('.confirm-msg').textContent = msg;
  root.style.display='flex';
  gsap.fromTo(root.querySelector('.confirm-backdrop'), {opacity:0}, {opacity:1, duration:0.2});
  gsap.fromTo(root.querySelector('.confirm-card'), {opacity:0, scale:0.9}, {opacity:1, scale:1, duration:0.25, ease:'back.out(1.7)'});
  const yesBtn = root.querySelector('.confirm-yes'), noBtn = root.querySelector('.confirm-no');
  const cleanup = ()=>{
    gsap.to(root.querySelector('.confirm-card'), {opacity:0, scale:0.9, duration:0.15});
    gsap.to(root.querySelector('.confirm-backdrop'), {opacity:0, duration:0.15, onComplete:()=>{ root.style.display='none'; }});
    yesBtn.onclick=null; noBtn.onclick=null;
  };
  yesBtn.onclick = ()=>{ cleanup(); onYes(); };
  noBtn.onclick = ()=>{ cleanup(); };
}

/* =========================================================
   DEMO INFO MODAL (manual open only, no auto-show)
   ========================================================= */
function openDemoInfoModal(){
  const overlay = document.getElementById('demo-info-overlay');
  overlay.style.display='flex';
  gsap.fromTo('#demo-info-backdrop', {opacity:0}, {opacity:1, duration:0.25});
  gsap.fromTo('#demo-info-card', {opacity:0, scale:0.92}, {opacity:1, scale:1, duration:0.3, ease:'power2.out'});
}
function closeDemoInfoModal(){
  gsap.to('#demo-info-card', {opacity:0, scale:0.92, duration:0.2});
  gsap.to('#demo-info-backdrop', {opacity:0, duration:0.2, onComplete:()=>{ document.getElementById('demo-info-overlay').style.display='none'; }});
}
</script>
<script>
/* =========================================================
   D0 — flat delivery list (sorted oldest -> newest)
   ========================================================= */
function renderD0CardHTML(o){
  const b = findBooth(o.boothId);
  const summary = o.items.map(it=>`${it.name}x${it.qty}`).join('、');
  let actionBtn;
  if(o.status==='pending') actionBtn = `<button class="btn-primary sm" data-act="pickup" data-order-id="${o.id}">取件出發</button>`;
  else if(o.status==='delivering') actionBtn = `<button class="btn-primary sm" data-act="delivered" data-order-id="${o.id}">已送達</button>`;
  else actionBtn = `<button class="btn-secondary sm" data-act="resolve" data-order-id="${o.id}">解除異常</button>`;
  return `<div class="d0-card" data-order-id="${o.id}">
    <div class="d0-card-row1"><span class="booth-no">${o.boothId}</span><span class="status-tag status-${o.status}">${STATUS_LABEL[o.status]}</span></div>
    <div class="order-vendor">${b.vendor||'—'}</div>
    <div class="order-summary">${summary}</div>
    <div class="d0-card-actions">
      <button class="btn-ghost sm" data-act="locate" data-order-id="${o.id}">📍 查看位置</button>
      ${actionBtn}
    </div>
  </div>`;
}
function renderD0List(flashOrderId){
  const container = document.getElementById('v2-order-list');
  const list = activeOrdersSorted();
  document.getElementById('v2-count-chip').textContent = list.length + ' 筆';
  const emptyState = document.getElementById('v2-empty-state');
  if(list.length===0){
    const wasEmpty = emptyState.style.display==='flex';
    container.innerHTML='';
    emptyState.style.display='flex';
    if(!wasEmpty){
      gsap.fromTo(emptyState, {opacity:0, y:8, scale:0.88}, {opacity:1, y:0, scale:1, duration:0.5, ease:'back.out(1.6)'});
      celebrateV2Empty();
    }
    return;
  }
  emptyState.style.display='none';
  container.innerHTML = list.map(o=> renderD0CardHTML(o)).join('');
  if(flashOrderId){
    const card = container.querySelector(`[data-order-id="${flashOrderId}"]`);
    if(card) gsap.fromTo(card, {y:-20, opacity:0}, {y:0, opacity:1, duration:0.5, ease:'back.out(1.4)'});
    else {
      const tag = container.querySelector(`[data-order-id="${flashOrderId}"] .status-tag`);
      if(tag) gsap.fromTo(tag, {scale:1.35}, {scale:1, duration:0.4, ease:'back.out(3)'});
    }
  }
}
/* 輕慶祝: small confetti burst when the delivery list empties out */
function celebrateV2Empty(){
  const host = document.getElementById('v2-d0-scroll');
  if(!host) return;
  const colors = ['#B8893C','#4C8C5A','#2F6FA8','#D93025','#7B4FA6'];
  for(let i=0;i<12;i++){
    const d = document.createElement('span');
    d.className='confetti-dot';
    d.style.background = colors[i%colors.length];
    host.appendChild(d);
    const ang = (Math.PI*2*i)/12 + Math.random()*0.4;
    gsap.fromTo(d, {x:0, y:0, scale:1, opacity:1},
      {x:Math.cos(ang)*(50+Math.random()*40), y:Math.sin(ang)*(40+Math.random()*30)+24, scale:0.3, opacity:0,
       duration:0.9+Math.random()*0.3, ease:'power1.out', onComplete:()=>d.remove()});
  }
}
function bindD0ListDelegation(){
  document.getElementById('v2-order-list').addEventListener('click', e=>{
    const btn = e.target.closest('[data-act]'); if(!btn) return;
    const orderId = btn.getAttribute('data-order-id'), act = btn.getAttribute('data-act');
    const o = getOrder(orderId); if(!o) return;
    if(act==='locate'){ navigateV2('d1','forward', {focusBoothId:o.boothId}); }
    else if(act==='pickup'){ setOrderStatus(orderId,'delivering', orderId); }
    else if(act==='delivered'){ confirmThenDeliver(orderId); }
    else if(act==='resolve'){ setOrderStatus(orderId,'pending', orderId); }
  });
}

/* pull-to-refresh */
function initPullToRefresh(){
  const scrollEl = document.getElementById('v2-d0-scroll');
  const indicator = document.getElementById('v2-pull-indicator');
  let startY=0, pulling=false;
  scrollEl.addEventListener('pointerdown', e=>{ if(scrollEl.scrollTop<=0){ startY=e.clientY; pulling=true; } });
  scrollEl.addEventListener('pointermove', e=>{
    if(!pulling) return;
    const dy = e.clientY-startY;
    if(dy>0 && dy<100){ gsap.set(indicator, {y:Math.min(dy,60), opacity:Math.min(dy/60,1)}); }
  });
  const endPull = e=>{
    if(!pulling) return;
    pulling=false;
    const dy = (e.clientY||0)-startY;
    gsap.to(indicator, {y:0, opacity:0, duration:0.3});
    if(dy>60){ doRefreshD0(); }
  };
  scrollEl.addEventListener('pointerup', endPull);
  scrollEl.addEventListener('pointercancel', endPull);
}
function doRefreshD0(){
  gsap.fromTo('#v2-order-list .d0-card', {opacity:0.4}, {opacity:1, stagger:0.04, duration:0.3});
  updateV2RefreshTime();
  showToast('已更新');
}
function updateV2RefreshTime(){
  const el = document.getElementById('v2-refresh-time');
  if(el) el.textContent = '更新於 ' + nowTimeStr();
}

/* =========================================================
   D1 — mobile map
   ========================================================= */
function triggerD1Focus(){
  if(!state.pendingFocus){
    document.getElementById('v2-d1-title').textContent = '全場地圖';
    return;
  }
  const boothId = state.pendingFocus;
  const b = findBooth(boothId);
  document.getElementById('v2-d1-title').textContent = b.id + ' ' + (b.vendor||'');
  focusBooth('v2', boothId, {scale:2.8});
  state.pendingFocus = null;
}

/* =========================================================
   BOTTOM SHEET
   ========================================================= */
function renderSheetHeaderHTML(boothId){
  const b = findBooth(boothId);
  return `<div class="sheet-headline"><span class="sheet-booth-id">${b.id}</span><span class="sheet-vendor">${b.vendor||'—'}</span></div><div class="sheet-sub">${b.zone||'未分類'}｜1館 1F</div>`;
}
function openBottomSheet(boothId){
  state.sheetBoothId = boothId;
  const orders = boothOrders(boothId).filter(o=>['pending','delivering','exception'].includes(o.status));
  /* keep the D1 top bar context in sync with the booth being inspected */
  const bTitle = findBooth(boothId);
  const titleEl = document.getElementById('v2-d1-title');
  if(titleEl && bTitle) titleEl.textContent = bTitle.id + (bTitle.vendor ? ' ' + bTitle.vendor : '');
  document.getElementById('v2-sheet-header').innerHTML = renderSheetHeaderHTML(boothId);
  document.getElementById('v2-sheet-body').innerHTML = orders.map(o=> renderOrderDetailCard(o)).join('');
  const sheet = document.getElementById('v2-sheet');
  const backdrop = document.getElementById('v2-sheet-backdrop');
  backdrop.style.display='block'; sheet.style.display='flex';
  gsap.fromTo(backdrop, {opacity:0}, {opacity:1, duration:0.25});
  gsap.fromTo(sheet, {yPercent:100}, {yPercent:0, duration:0.45, ease:'back.out(1.2)'});
}
function refreshSheetIfOpen(){
  if(!state.sheetBoothId) return;
  const boothId = state.sheetBoothId;
  const orders = boothOrders(boothId).filter(o=>['pending','delivering','exception'].includes(o.status));
  if(orders.length===0){ closeBottomSheet(); return; }
  document.getElementById('v2-sheet-body').innerHTML = orders.map(o=> renderOrderDetailCard(o)).join('');
}
function closeBottomSheet(){
  const sheet = document.getElementById('v2-sheet');
  const backdrop = document.getElementById('v2-sheet-backdrop');
  gsap.to(sheet, {yPercent:100, duration:0.3, ease:'power1.in', onComplete:()=>{ sheet.style.display='none'; state.sheetBoothId=null; }});
  gsap.to(backdrop, {opacity:0, duration:0.3, onComplete:()=>{ backdrop.style.display='none'; }});
}
function initSheetDrag(){
  const handle = document.getElementById('v2-sheet-handle');
  const sheet = document.getElementById('v2-sheet');
  let startY=0, startPct=0, dragging=false;
  handle.addEventListener('pointerdown', e=>{
    dragging=true; startY=e.clientY; startPct=gsap.getProperty(sheet,'yPercent');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  });
  handle.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const deltaPct = ((e.clientY-startY)/sheet.offsetHeight)*100;
    gsap.set(sheet, {yPercent: clamp(startPct+deltaPct, 0, 100)});
  });
  const endDrag = ()=>{
    if(!dragging) return; dragging=false;
    const pct = gsap.getProperty(sheet,'yPercent');
    if(pct>35){ closeBottomSheet(); } else { gsap.to(sheet, {yPercent:0, duration:0.3, ease:'power2.out'}); }
  };
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);
}

/* =========================================================
   D0 <-> D1 sub-view router
   ========================================================= */
function updateTabActive(){
  document.getElementById('tab-d0').classList.toggle('active', state.currentV2==='d0');
  document.getElementById('tab-d1').classList.toggle('active', state.currentV2==='d1');
}
function navigateV2(target, direction, opts){
  opts = opts || {};
  const from = state.currentV2;
  if(from===target){
    if(opts.focusBoothId){ state.pendingFocus = opts.focusBoothId; triggerD1Focus(); }
    return;
  }
  const fromEl = document.getElementById('v2-'+from);
  const toEl = document.getElementById('v2-'+target);
  const dir = direction==='back' ? 1 : -1;
  toEl.classList.add('is-active');
  gsap.set(toEl, {xPercent: -dir*100});
  gsap.to(fromEl, {xPercent: dir*100, duration:0.35, ease:'power2.inOut'});
  gsap.to(toEl, {xPercent:0, duration:0.35, ease:'power2.inOut', onComplete:()=>{
    fromEl.classList.remove('is-active');
    gsap.set(fromEl, {xPercent:0});
  }});
  state.currentV2 = target;
  updateTabActive();
  if(target==='d1'){
    if(opts.focusBoothId){ state.pendingFocus = opts.focusBoothId; setTimeout(()=> triggerD1Focus(), 380); }
    else { zoomReset('v2'); document.getElementById('v2-d1-title').textContent = '全場地圖'; }
  }
}

/* =========================================================
   SIMULATE / RESET
   ========================================================= */
function onOrderCreated(order){
  refreshBoothVisuals();
  renderD0List(order.id);
  showToast('已新增 1 筆訂單');
}
function simulateNewOrder(){
  const candidates = MAP_DATA.booths.filter(b=> isBoothFree(b.id));
  if(candidates.length===0){ showToast('目前所有攤位都有訂單了'); return; }
  const booth = candidates[Math.floor(Math.random()*candidates.length)];
  const itemCount = 1 + Math.floor(Math.random()*2);
  const pool = [...MENU_NAMES];
  const items = [];
  for(let i=0;i<itemCount;i++){
    const idx = Math.floor(Math.random()*pool.length);
    const name = pool.splice(idx,1)[0];
    const qty = 1 + Math.floor(Math.random()*3);
    const note = name.includes('便當') && Math.random()<0.4 ? RANDOM_NOTE_OPTIONS[1+Math.floor(Math.random()*(RANDOM_NOTE_OPTIONS.length-1))] : '';
    items.push({name, qty, note});
  }
  const tmpl = RANDOM_NOTE_TEMPLATES[Math.floor(Math.random()*RANDOM_NOTE_TEMPLATES.length)];
  const order = { id: nextOrderId(), boothId: booth.id, status:'pending', items, noteRaw: tmpl(booth.vendor, booth.id), createdAt: Date.now() };
  state.orders.push(order);
  onOrderCreated(order);
}
function resetDemo(){
  ORDER_SEQ = 1;
  seedAndCompute();
  refreshBoothVisuals();
  renderD0List();
  if(document.getElementById('v2-sheet').style.display==='flex') closeBottomSheet();
  zoomReset('v2');
  showToast('已重置');
}
</script>
<script>
/* =========================================================
   INIT
   ========================================================= */
function initV2FirstEntry(){
  initMapSvg('v2-map-svg','v2');
  attachMapEvents('v2-map-svg','v2');
  refreshBoothVisuals();
  bindD0ListDelegation();
  initPullToRefresh();
  initSheetDrag();
  renderD0List();
  updateV2RefreshTime();
  updateTabActive();
}

function toggleDemoFabMenu(){
  document.getElementById('demo-fab-menu').classList.toggle('open');
}
function closeDemoFabMenuIfRealPhone(){
  if(state.isRealPhone) document.getElementById('demo-fab-menu').classList.remove('open');
}

/* =========================================================
   GLOBAL UI BINDINGS
   ========================================================= */
function bindGlobalUI(){
  qs('#btn-demo-info').onclick = ()=>{ openDemoInfoModal(); closeDemoFabMenuIfRealPhone(); };
  qs('#demo-info-close').onclick = closeDemoInfoModal;
  qs('#demo-info-backdrop').onclick = closeDemoInfoModal;
  qs('#btn-simulate').onclick = ()=>{ simulateNewOrder(); closeDemoFabMenuIfRealPhone(); };
  qs('#btn-reset').onclick = ()=>{ resetDemo(); closeDemoFabMenuIfRealPhone(); };
  qs('#demo-fab-toggle').onclick = toggleDemoFabMenu;
  qs('#v2-zoom-in').onclick = ()=> zoomBy('v2',1.3);
  qs('#v2-zoom-out').onclick = ()=> zoomBy('v2',1/1.3);
  qs('#v2-refresh-btn').onclick = doRefreshD0;
  qs('#v2-d1-back').onclick = ()=> navigateV2('d0','back');
  qs('#v2-sheet-backdrop').onclick = ()=> closeBottomSheet();
  qs('#tab-d0').onclick = ()=> navigateV2('d0','back');
  qs('#tab-d1').onclick = ()=> navigateV2('d1','forward',{});
  qs('#tab-profile').onclick = ()=> showToast('正式版將提供');
  document.getElementById('v2-sheet-body').addEventListener('click', e=> handleDetailAction(e));
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && document.getElementById('v2-sheet').style.display==='flex') closeBottomSheet();
  });
}

function initApp(){
  seedAndCompute();
  if(state.isRealPhone) document.body.classList.add('real-phone');
  initV2FirstEntry();
  bindGlobalUI();
  gsap.fromTo('#view-v2', {opacity:0}, {opacity:1, duration:0.4});
}
document.addEventListener('DOMContentLoaded', initApp);
</script>
